<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌤 AQI Predictions - Next 3 Days</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(to bottom, #eef6f9, #ffffff);
            color: #333;
            padding: 40px;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            color: #006d77;
            margin-bottom: 20px;
        }

        .table-container {
            display: flex;
            justify-content: center;
        }

        table {
            border-collapse: collapse;
            min-width: 320px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background-color: #83c5be;
            color: white;
            padding: 12px;
            font-size: 1rem;
        }

        td {
            background-color: white;
            padding: 12px;
            text-align: center;
            font-size: 0.95rem;
        }

        tr:nth-child(even) td {
            background-color: #f8f9fa;
        }

        .error {
            text-align: center;
            color: red;
            font-weight: bold;
        }

        .no-data {
            text-align: center;
            font-size: 1rem;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>🌤 AQI Predictions - Next 3 Days</h1>
    
    {% if error %}
        <p class="error">Error: {{ error }}</p>
    {% elif predictions %}
        <div class="table-container">
            <table>
                <tr>
                    <th>Date</th>
                    <th>Predicted AQI</th>
                </tr>
                {% for p in predictions %}
                <tr>
                    <td>{{ p.prediction_date }}</td>
                    <td>{{ p.prediction_value }}</td>
                </tr>
                {% endfor %}
            </table>
        </div>
    {% else %}
        <p class="no-data">No predictions available.</p>
    {% endif %}
</body>
</html>
